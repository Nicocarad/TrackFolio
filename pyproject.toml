[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trackfolio"
version = "0.1.0"
description = "Local-first investment portfolio tracker"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "plotly>=5.24",
    "python-stdnum>=1.20",
    "sqlmodel>=0.0.22",
    "streamlit>=1.40",
    "yfinance>=0.2.50",
]

[project.optional-dependencies]
dev = ["mypy>=1.13", "pytest>=8.3", "ruff>=0.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/trackfolio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
ignore_missing_imports = true
