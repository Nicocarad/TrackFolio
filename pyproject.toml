[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trackfolio"
version = "0.1.0"
description = "Local-first investment portfolio tracker"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.143.3",
    "jinja2>=3.1.6",
    "numpy>=2.0",
    "pandas>=2.2",
    "plotly>=5.24",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.0",
    "python-multipart>=0.0.32",
    "python-stdnum>=1.20",
    "sqlmodel>=0.0.22",
    "uvicorn[standard]>=0.54.0",
    "yfinance>=0.2.50",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/trackfolio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Form"]

[tool.mypy]
python_version = "3.14"
mypy_path = "src"
strict = true
ignore_missing_imports = true
