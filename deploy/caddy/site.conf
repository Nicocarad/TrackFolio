encode zstd gzip

header {
	Strict-Transport-Security "max-age=31536000"
	X-Content-Type-Options "nosniff"
	Referrer-Policy "same-origin"
	# Scripts and styles stay unrestricted because pages use inline scripts and Plotly.
	Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
	-Server
}

request_body {
	max_size 1MB
}

# Caddy keeps the original Host header, which the app's origin check relies on, and adds
# X-Forwarded-For with the real client address for the app's per-IP rate limits.
reverse_proxy 127.0.0.1:8000
